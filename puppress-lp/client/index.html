<!doctype html>
<html lang="ja">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EKZWS6X6BG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EKZWS6X6BG');

      // スクロール深度トラッキング
      const scrollThresholds = [25, 50, 75, 90];
      let sentThresholds = new Set();

      window.addEventListener('scroll', () => {
        const scrollPercent = (window.scrollY + window.innerHeight) / document.body.scrollHeight * 100;

        scrollThresholds.forEach(threshold => {
          if (scrollPercent >= threshold && !sentThresholds.has(threshold)) {
            gtag('event', 'scroll_depth', {
              event_category: 'engagement',
              event_label: `${threshold}%`,
              value: threshold
            });
            sentThresholds.add(threshold);
            console.log(`✅ ${threshold}% 到達イベント送信`);
          }
        });
      });
    </script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>PupPress - プロテイン習慣サポートサプリメント</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"
    ></script>
  </body>
</html>
